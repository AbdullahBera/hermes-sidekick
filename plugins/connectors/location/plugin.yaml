id: location
name: Location & Maps
category: connector
summary: Geocoding, distances, ETAs, and "leave by" timing — keyless (OpenStreetMap), no key/card.

requires:
  connectors: []
  human: []                    # keyless by default — nothing to sign up for

security:
  provider: openstreetmap      # geocode via Nominatim, routing via OSRM — public OSM services
  writes: []                   # read-only lookups; no account actions
  ask_first: false             # it only answers you / feeds commute prep
  secrets_location: vm         # only if you opt into ORS (an API key in ~/.hermes/.env)

setup:
  - human:  "Set connectors.location.home (your home latitude/longitude) in the profile"
  - auto:   "None — it's keyless curl calls from the automation prompts (Nominatim + OSRM)"
  - verify: "A geocode + a route both return results (see recipe.md)"

settings:
  provider: osm                # osm (keyless Nominatim + OSRM) | ors (optional, more reliable, needs key)
  units: metric                # metric | imperial
  mode: driving                # driving | walking | cycling
  buffer_mins: 10              # arrive this many minutes early when computing "leave by"
  home:                        # origin for travel time (your home; VM-only, never in the repo)
    label: "home"
    latitude: 0.0
    longitude: 0.0

hermes:
  kind: none                   # not an MCP server — a keyless HTTP capability the prompts curl
                               # (like the weather line). Optional ORS upgrade would add a key.

notes: >
  Keyless via public OpenStreetMap services: Nominatim for geocoding
  (https://nominatim.openstreetmap.org, requires a User-Agent header, ~1 req/sec) and OSRM for
  routing (https://router.project-osrm.org). Powers commute/meeting prep ("leave by 2:38 for
  your 3pm"). Privacy: the addresses/coords you look up are sent to these public OSM servers.
  Optional upgrade: set provider: ors with a free OpenRouteService key for higher reliability,
  or Google for rich place data (needs billing). Rich real-time "leave now" alerts want always-on.
