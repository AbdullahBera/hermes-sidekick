# Example hermes-sidekick profile.
# The real one lives in the user's VM at ~/.hermes/sidekick/profile.yaml (never in the repo).
# It holds CHOICES + SETTINGS only — no secrets. See docs/PROFILE.md.
version: 1

core:
  model: claude-sonnet-5           # claude-sonnet-5 | claude-opus-4-8 | claude-haiku-4-5
  timezone: America/Los_Angeles
  quiet_hours: "22:00-07:00"       # no proactive messages inside this local window
  rate_limit_per_day: 6            # SOFT daily ceiling — a judgment guide, not a hard counter

channels:
  signal:
    enabled: true
    allowed_users: ["+1XXXXXXXXXX"]
    home_channel: "+1XXXXXXXXXX"
    reactions: false
  imessage:
    enabled: false                 # planned — needs an always-on Mac + a secondary Apple ID
    allowed_users: []
    home_channel: ""

connectors:
  gmail:
    enabled: true
    important_senders: []          # e.g. ["boss@work.com", "mom@family.com"]
    summary_style: concise
    triage:                        # how email-triage sorts your inbox — YOUR labels, your choice
      file_into:                   # Gmail label NAMES the assistant may add to messages
        - Bank                     # (use your own existing labels; leave [] to skip filing)
        - Travel
        - Newsletters
        - Receipts
      create_missing: false        # true = create a mapped label that doesn't exist yet
      hints: "Bank=finance/statements; Travel=flights/hotels; Newsletters=digests; Receipts=orders/payments"
  calendar:
    enabled: true
    default_calendar: primary      # create/edit is granted but always ask-first
  contacts:
    enabled: true                  # read-only; also fills Google's "Birthdays" calendar
  location:
    enabled: false                 # planned — free OpenRouteService key, no card
    units: metric                  # metric | imperial
    home_address: ""               # base for 'how far' / 'leave by' calculations

automations:
  morning-brief:
    enabled: true
    time: "08:00"
    include: [calendar, email]
  birthday-reminder:
    enabled: false
    time: "08:30"                  # keep off morning-brief's time so they don't pile up
    lead_days: 1
  email-triage:
    enabled: true
    run: with-morning-brief        # with-morning-brief | standalone | on-demand
    lookback: "24h"                # how far back to consider
    max_items: 25                  # cap messages examined per run (token budget)
    auto_draft: true               # auto-draft clearly-needed replies, then show them (never send)
