id: calendar
name: Calendar
category: connector
summary: Read your schedule and free/busy, and create or edit events (ask-first).

requires:
  connectors: [gmail]       # reuses the same Google OAuth client + token as Gmail
  human:
    - google_calendar_api   # enable the Calendar API in the same project
    - oauth_consent         # re-approve to add the calendar.readonly scope

security:
  scopes: [calendar, calendar.events]
  writes: [create_event, edit_event, delete_event]
  ask_first: true           # never creates/edits/deletes an event without your explicit yes
  secrets_location: vm

setup:
  - human:  "Enable the Google Calendar API in the same project"
  - auto:   "Re-auth with gmail:drafts + calendar:full (adds the calendar scope to the token)"
  - human:  "Approve the consent screen ('See your calendars')"
  - auto:   "hermes mcp add calendar --command workspace-mcp --args --single-user --permissions calendar:full"
  - verify: "list_calendars returns your calendars"

settings:
  default_calendar: primary

hermes:
  kind: mcp
  server: workspace-mcp
  permissions: calendar:full

notes: >
  Shares one OAuth client with Gmail (enable Calendar API + re-auth). Read and write:
  the calendar:full scope is granted, so every create/edit/delete is gated by ask_first —
  the agent never changes an event without an explicit yes. Prefer read-only? Use
  calendar:readonly instead; see recipe.md.
