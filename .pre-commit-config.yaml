# Local pre-commit hooks — blocks secrets/PII BEFORE they're committed (keyless).
# One-time setup:  pip install pre-commit  &&  pre-commit install
# Run on demand:   pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks   # uses .gitleaks.toml at the repo root
