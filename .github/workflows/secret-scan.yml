name: secret-scan

# Server-side secret/PII scan on every push and PR. Keyless (gitleaks is free for public
# repos). Pairs with the local .pre-commit-config.yaml hook for defense in depth.
on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history so it scans every commit, not just the tip
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_CONFIG defaults to .gitleaks.toml at the repo root.
          # No GITLEAKS_LICENSE needed — this is a personal public repo.
