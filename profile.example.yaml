# Example hermes-sidekick profile.
# The real one lives in the user's VM at ~/.hermes/sidekick/profile.yaml (never in the repo).
# It holds CHOICES + SETTINGS only — no secrets. See docs/PROFILE.md.
version: 1

core:
  model: claude-sonnet-5           # claude-sonnet-5 | claude-opus-4-8 | claude-haiku-4-5
  timezone: America/Los_Angeles
  quiet_hours: "22:00-07:00"       # no proactive messages inside this local window
  rate_limit_per_day: 6            # SOFT daily ceiling — a judgment guide, not a hard counter

channels:
  signal:
    enabled: true
    allowed_users: ["+1XXXXXXXXXX"]
    home_channel: "+1XXXXXXXXXX"
    reactions: false
  imessage:
    enabled: false                 # planned — needs an always-on Mac + a secondary Apple ID
    allowed_users: []
    home_channel: ""

connectors:
  gmail:
    enabled: true
    important_senders: []          # e.g. ["boss@work.com", "mom@family.com"]
    summary_style: concise
    triage:                        # how email-triage sorts your inbox — YOUR labels, your choice
      file_into:                   # Gmail label NAMES the assistant may add to messages
        - Bank                     # (use your own existing labels; leave [] to skip filing)
        - Travel
        - Newsletters
        - Receipts
      create_missing: false        # true = create a mapped label that doesn't exist yet
      hints: "Bank=finance/statements; Travel=flights/hotels; Newsletters=digests; Receipts=orders/payments"
  calendar:
    enabled: true
    default_calendar: primary      # create/edit is granted but always ask-first
  contacts:
    enabled: true                  # read-only; also fills Google's "Birthdays" calendar
  location:
    enabled: true                  # keyless (OSM Nominatim + OSRM) — no key/card
    provider: osm                  # osm (keyless) | ors (optional, needs a free key)
    units: imperial                # metric | imperial
    mode: driving                  # driving | walking | cycling
    buffer_mins: 10                # arrive this many minutes early ("leave by")
    home:                          # your home coords (VM-only) — origin for travel time
      label: "home"
      latitude: 40.7128            # example only — replace with your own coordinates
      longitude: -74.0060
  notes:
    enabled: true                  # keyless local markdown (Obsidian vault or a folder)
    backend: obsidian              # obsidian | local
    path: "/path/to/your/vault"    # VM path to your notes (an Obsidian vault via the mount, or a VM folder)
    capture: daily                 # daily (append to YYYY-MM-DD.md) | inbox (Inbox.md) | <filename.md>
  web_actions:
    enabled: true                  # private browser automation IN your VM (see connectors/web-actions)
    allowed_domains: []            # optional allowlist; empty = any site (still bound by the ask-first rule)
    always_confirm_before_submit: true  # hard stop before checkout / order / send — never override

automations:
  morning-brief:
    enabled: true
    time: "08:00"
    include: [weather, calendar, email]
    weather:                       # open-meteo (keyless); your coordinates
      latitude: 40.7128            # example only — replace with your own coordinates
      longitude: -74.0060
      units: imperial              # imperial (°F) | metric (°C)
      label: "San Francisco"       # human name, for the brief text
  birthday-reminder:
    enabled: false
    time: "08:30"                  # keep off morning-brief's time so they don't pile up
    lead_days: 1
  email-triage:
    enabled: true
    run: with-morning-brief        # with-morning-brief | on-demand
    lookback: "24h"                # how far back to consider
    max_items: 25                  # cap messages examined per run (token budget)
    auto_draft: true               # auto-draft clearly-needed replies, then show them (never send)
    surface: [urgent, people]      # ranked: what to pull into "Needs you" first (rest is filed as noise)
  evening-prep:
    enabled: true
    time: "20:30"                  # an evening slot; keep it out of quiet hours
    include: [calendar, email]
    tight_gap_mins: 20             # flag back-to-backs closer than this
  follow-up-nudges:
    enabled: true
    time: "09:00"                  # silent unless a real person's email has gone unanswered
    stale_after_days: 2
    max_age_days: 10
    max_nudges: 3
    auto_draft: false              # offer + draft on a yes (older threads need your context)
  meeting-prep:
    enabled: true
    time: "07:45"                  # before the morning brief; silent unless you have real meetings
    min_attendees: 2               # only prep events with at least this many people
    lookback_days: 30              # how far back to find your last thread with an attendee
