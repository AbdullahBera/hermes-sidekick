name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt -r requirements-control.txt
      - run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          for script in scripts/*.sh onboarder/*.sh; do
            bash -n "$script" || exit 1
          done
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:sites
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  control-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sidekick_control/package-lock.json
      - run: npm --prefix sidekick_control ci --ignore-scripts
      - run: node sidekick_control/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm --prefix sidekick_control test
